# ---------------------------------------------------------------------------
# MySQL profile  (production / persistent database)
#
# Run with:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# or set SPRING_PROFILES_ACTIVE=mysql
#
# Credentials come from environment variables and MUST NOT be hardcoded here.
#   DB_URL      full JDBC url  (default: jdbc:mysql://localhost:3306/fleetdb...)
#   DB_USERNAME MySQL user     (no default - required)
#   DB_PASSWORD MySQL password (no default - required)
#
# Create the database once (the JDBC url also creates it if missing):
#   mysql -u root -p -e "CREATE DATABASE IF NOT EXISTS fleetdb CHARACTER SET utf8mb4;"
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleetdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate schema management. `update` is convenient for development.
# For production prefer `validate` (or `none`) and manage schema with migrations.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Store/read timestamps as UTC so Instant columns are consistent everywhere.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# H2 console is irrelevant on MySQL.
spring.h2.console.enabled=false

# Real-tracking profile: the GPS simulator is OFF by default so only genuine
# mobile/device positions are shown. Enable it for a demo with:
#   set GPS_SIMULATOR_ENABLED=true
app.gps.simulator.enabled=${GPS_SIMULATOR_ENABLED:false}
