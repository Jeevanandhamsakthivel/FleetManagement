spring.application.name=fleet-backend
server.port=8080

# --- Default profile: H2 in-memory (runs instantly, no external DB needed) ---
spring.datasource.url=jdbc:h2:mem:fleetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Application settings ---
app.jwt.secret=dev-only-secret-change-me-in-production-please-0123456789
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173
app.gps.simulator.enabled=true
app.gps.simulator.interval-ms=3000
app.seed.enabled=true
