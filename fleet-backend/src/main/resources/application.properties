spring.application.name=fleet-backend
server.port=8080

# --- Default profile: H2 in-memory (zero-setup development only) ---
# For a persistent MySQL database use the `mysql` profile:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# See application-mysql.properties. H2 is intentionally kept as the default so the
# project still runs instantly for local development and automated tests.
spring.datasource.url=jdbc:h2:mem:fleetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Application settings ---
# Include exception messages in error responses so the UI can show useful feedback.
server.error.include-message=always
app.jwt.secret=dev-only-secret-change-me-in-production-please-0123456789
app.jwt.expiration-ms=86400000
# Origin patterns (supports wildcards). The *.trycloudflare.com entry lets the
# HTTPS development tunnel work. Override in production via CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,https://*.trycloudflare.com}
app.gps.simulator.enabled=true
app.gps.simulator.interval-ms=3000
app.seed.enabled=true
